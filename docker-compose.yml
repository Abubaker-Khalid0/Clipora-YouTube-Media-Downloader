# Docker Compose — Clipora Production Stack
#
# For frontend-only development, run `npm run dev` inside frontend/ instead.
# Use this file only when you need the full stack running together.

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - temp_files:/app/storage/temp
    env_file:
      - .env
    environment:
      ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STORAGE_PATH: /app/storage/temp
      MAX_FILE_AGE_MINUTES: ${MAX_FILE_AGE_MINUTES:-30}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-300}
      DOWNLOAD_TIMEOUT_SECONDS: ${DOWNLOAD_TIMEOUT_SECONDS:-1800}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BACKEND_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  temp_files:
    driver: local
